services:
  mysql:
    image: mysql:8.0
    container_name: mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: "070078"
      MYSQL_DATABASE: mydb
      MYSQL_USER: itsanla
      MYSQL_PASSWORD: "070078"
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app_network

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: phpmyadmin
    restart: always
    environment:
      PMA_HOST: mysql_db
      PMA_PORT: 3306
    ports:
      - "8081:80"
    volumes:
      - ./phpmyadmin-config.php:/etc/phpmyadmin/config.user.inc.php
    depends_on:
      - mysql
    networks:
      - app_network

  metabase:
    image: metabase/metabase:latest
    container_name: metabase
    restart: always
    ports:
      - "3000:3000"
    environment:
      MB_DB_TYPE: h2
      MB_DB_FILE: /metabase-data/metabase.db
    volumes:
      - metabase_data:/metabase-data
    depends_on:
      - mysql
    networks:
      - app_network

volumes:
  mysql_data:
  metabase_data:

networks:
  app_network:
    driver: bridge
