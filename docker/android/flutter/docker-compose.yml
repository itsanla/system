services:
  flutter:
    image: mobiledevops/flutter-sdk-image:latest
    container_name: flutter-dev
    working_dir: /app
    volumes:
      - /home/anla/project:/app
    ports:
      - "8090:8090"   # untuk: flutter run -d web-server --web-hostname=0.0.0.0 --web-port=8090
    tty: true
    stdin_open: true
    command: ["tail", "-f", "/dev/null"]
    restart: unless-stopped

# Pemakaian:
#   docker compose up -d
#   docker compose exec flutter bash
#   flutter build apk --release                                    # build APK
#   flutter run -d web-server --web-hostname=0.0.0.0 --web-port=8090  # preview UI lewat browser
# Catatan: port 8080/8081/8000 di host VPS sudah dipakai Coolify/Traefik, jangan dipakai ulang.
# /home/anla/project di-mount ke /app supaya semua repo yang di-clone ke ~/project/<repo>
# (sesuai konvensi bima.md) otomatis kelihatan di dalam container tanpa perlu compose baru.
